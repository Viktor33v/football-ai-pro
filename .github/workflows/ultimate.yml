name: Football AI PRO V10 Ultimate
on:
  workflow_dispatch:
permissions:
  contents: write
concurrency:
  group: football-v6-journal
  cancel-in-progress: false
jobs:
  ultimate:
    runs-on: ubuntu-latest
    timeout-minutes: 30
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: '3.12'
      - if: ${{ hashFiles('state/journal.json') == '' }}
        uses: actions/cache/restore@v4
        with:
          path: state
          key: football-v6-journal-${{ github.run_id }}-${{ github.run_attempt }}
          restore-keys: |
            football-v6-journal-
      - run: python -m py_compile ultimate.py smart.py corners.py cards.py bot.py backtest.py
      - run: python ultimate.py
        env:
          FOOTBALL_API_KEY: ${{ secrets.FOOTBALL_API_KEY }}
          TELEGRAM_BOT_TOKEN: ${{ secrets.TELEGRAM_BOT_TOKEN }}
          TELEGRAM_CHAT_ID: ${{ secrets.TELEGRAM_CHAT_ID }}
      - name: Persist public goals journal
        if: ${{ always() && hashFiles('state/journal.json') != '' }}
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add state/journal.json
          if ! git diff --cached --quiet; then
            git commit -m "Update demo prediction journal"
            git pull --rebase origin main
            git push origin HEAD:main
          fi
      - uses: actions/upload-artifact@v4
        if: always()
        with:
          name: football-ultimate
          path: |
            ultimate.json
            corners.json
            cards.json
            state/journal.json
          retention-days: 90
