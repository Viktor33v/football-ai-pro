name: Football AI PRO V24 Commands
on:
  workflow_dispatch:
    inputs:
      diagnostic:
        description: Send Telegram test message
        type: boolean
        default: true
permissions:
  contents: read
concurrency:
  group: telegram-v11-commands
  cancel-in-progress: false
jobs:
  commands:
    runs-on: ubuntu-latest
    timeout-minutes: 5
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: '3.12'
      - run: python -m py_compile commands.py snapshot.py
      - run: python paper24.py
      - run: python commands.py
        env:
          TELEGRAM_BOT_TOKEN: ${{ secrets.TELEGRAM_BOT_TOKEN }}
          TELEGRAM_DIAGNOSTIC: ${{ inputs.diagnostic && '1' || '0' }}
          TELEGRAM_CHAT_ID: ${{ secrets.TELEGRAM_CHAT_ID }}
