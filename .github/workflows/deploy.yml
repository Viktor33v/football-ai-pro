name: Football AI PRO Safe Deploy
on:
  workflow_run:
    workflows: ["Football AI PRO Filter Tests"]
    types: [completed]
permissions:
  contents: read
concurrency:
  group: football-production-deploy
  cancel-in-progress: false
jobs:
  deploy:
    if: ${{ github.event.workflow_run.conclusion == 'success' && github.event.workflow_run.event == 'push' && github.event.workflow_run.head_branch == 'main' }}
    runs-on: ubuntu-latest
    timeout-minutes: 5
    steps:
      - name: Check FadeHost deployment configuration
        env:
          DEPLOY_URL: ${{ secrets.FADEHOST_DEPLOY_WEBHOOK }}
        run: |
          if [ -z "$DEPLOY_URL" ]; then
            echo "::notice::FADEHOST_DEPLOY_WEBHOOK not configured. No production deployment attempted."
            echo "CONFIGURED=false" >> "$GITHUB_ENV"
          else
            echo "CONFIGURED=true" >> "$GITHUB_ENV"
          fi
      - name: Trigger configured FadeHost deploy webhook
        if: env.CONFIGURED == 'true'
        env:
          DEPLOY_URL: ${{ secrets.FADEHOST_DEPLOY_WEBHOOK }}
        run: |
          case "$DEPLOY_URL" in https://*) ;; *) echo "::error::Webhook must use HTTPS"; exit 1;; esac
          curl --fail --show-error --silent --location --max-time 60 --retry 2 --request POST "$DEPLOY_URL" >/dev/null
          echo "FadeHost deploy request sent. Verify hosting health separately."
