name: V22 DATA CONTROL
on: workflow_dispatch
permissions:
  contents: write
concurrency: football-v6-journal
jobs:
  audit:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: '3.12'
      - run: python -m py_compile quality22.py commands.py model21.py
      - run: python quality22.py
      - run: |
          git config user.name football-bot
          git config user.email football-bot@users.noreply.github.com
          git add state/quality22.json
          git diff --cached --quiet || git commit -m 'V22 archive audit'
          git pull --rebase origin main
          git push
