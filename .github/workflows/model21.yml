name: V21 MODEL TEST
on: workflow_dispatch
permissions:
  contents: write
concurrency: football-v6-journal
jobs:
  test:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: '3.12'
      - run: python model21.py
      - run: |
          git config user.name football-bot
          git config user.email football-bot@users.noreply.github.com
          git add state/model21.json
          git diff --cached --quiet || git commit -m 'V21 test results'
          git pull --rebase origin main
          git push
