name: Football AI PRO Filter Tests
on:
  workflow_dispatch:
  push:
    branches: [main]
    paths:
      - '*.py'
      - '.github/workflows/filter-tests.yml'
      - '.github/workflows/deploy.yml'
permissions:
  contents: read
jobs:
  tests:
    runs-on: ubuntu-latest
    timeout-minutes: 5
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: '3.12'
      - run: python -m py_compile commands.py reliability26.py test_filter.py test_reliability26.py forward28.py test_forward28.py smart.py snapshot.py team_ru.py test_fixture_safety.py corners.py cards.py test_csv_fixtures.py
      - run: python -m unittest -v test_filter test_reliability26 test_forward28 test_fixture_safety test_csv_fixtures
